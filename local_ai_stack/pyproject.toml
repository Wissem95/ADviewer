[project]
name = "localcoder"
version = "0.2.0"
description = "IDE IA local — agents intelligents pour le developpement"
requires-python = ">=3.12"
dependencies = [
    "aider-chat>=0.82",
    "rich>=13.0",
    "fastapi>=0.128",
    "uvicorn[standard]>=0.30",
    "litellm>=1.81",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "PyGithub>=2.3",
    "GitPython>=3.1",
    "psutil>=6.0",
    "tiktoken>=0.7",
]

[project.scripts]
localcoder = "localcoder.cli:main"

[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not llm_live'"
markers = [
    "llm_live: tests needing real LLM API keys (skipped by default, run via scripts/smoke_llms.sh)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["localcoder*", "backend*"]
