name: adviewer
description: Watch ads and earn rewards - A mobile app where users watch video ads and earn points through quizzes

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  cupertino_icons: ^1.0.6

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  animations: ^2.0.11

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.0

  # Network & API
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0
  pretty_dio_logger: ^1.3.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Video Player
  video_player: ^2.8.1
  chewie: ^1.7.4

  # Audio
  just_audio: ^0.9.36

  # Device & Platform
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  connectivity_plus: ^5.0.2
  permission_handler: ^11.1.0

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Firebase (Analytics & Messaging) - commented out for now
  # firebase_core: ^2.24.0
  # firebase_analytics: ^10.7.4
  # firebase_messaging: ^14.7.4
  # firebase_crashlytics: ^3.4.4

  # Local Notifications
  flutter_local_notifications: ^16.3.0

  # Biometrics & Security
  local_auth: ^2.1.7
  crypto: ^3.0.3

  # Image handling
  image_picker: ^1.0.4
  image_cropper: ^5.0.1

  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

  # Share
  share_plus: ^7.2.1

  # URL Launcher
  url_launcher: ^6.2.1

  # File handling
  path_provider: ^2.1.1

  # Loading & Progress
  flutter_spinkit: ^5.2.0

  # Toast & Snackbar
  fluttertoast: ^8.2.4

  # Pull to refresh
  pull_to_refresh: ^2.0.0

  # Ads (for monetization) - commented out for now
  # google_mobile_ads: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1

  # Code generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/videos/

